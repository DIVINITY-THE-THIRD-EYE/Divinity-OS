name: 🐛 Bug Report
description: Report a bug in the Divinity app or website
title: "bug: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      options:
        - Flutter app (mobile)
        - Website (Next.js)
        - Supabase (DB / RLS / Edge Functions)
        - CI/CD
        - Docs
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Your Role (if app-related)
      options:
        - Student
        - Trainer
        - Admin
        - N/A (website/docs)
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - N/A
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App/Site Version
      placeholder: e.g. 1.2.3
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what you saw...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app/site
        2. Go to '...'
        3. Tap/click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: If applicable, add screenshots or a video recording.

  - type: textarea
    id: logs
    attributes:
      label: Error logs
      description: Paste any relevant error messages.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I'm using the latest version
          required: false
