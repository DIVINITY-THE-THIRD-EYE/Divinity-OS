name: ✨ Feature / Content Request
description: Suggest a new website page, content section, or visual improvement
title: "feat: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea clearly.

  - type: dropdown
    id: request-type
    attributes:
      label: What kind of request is this?
      options:
        - Content update (timings, descriptions, text)
        - Visual / UI enhancement (colors, animations, assets)
        - New Page / Route
        - SEO / Metadata improvement
        - Accessibility (a11y) fix
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Describe the current limitation or what is out of date...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: Describe the wording, layout, or feature you want to add...
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Visual references / Mockups
      description: Attach any wireframes or screenshots of design references.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
