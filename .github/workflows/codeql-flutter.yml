name: CodeQL Security Scan (Flutter/Android)

# Deliberately NOT triggered on every pull_request — see docs/CODEQL_STRATEGY.md.
# This job alone (Flutter debug build + Java/Kotlin CodeQL analysis) has taken
# 25-40+ minutes per run, which is expensive on a private repo's limited
# included Actions minutes. It now runs on pushes to main/release branches,
# once weekly, or on demand via workflow_dispatch — a maintainer can still run
# it against any PR branch manually from the Actions tab (Run workflow ->
# pick the branch) when a security-sensitive PR specifically warrants it.
on:
  push:
    branches: [main, feature/trust-certificates]
    paths:
      - 'flutter-app/**'
  schedule:
    # Run every Sunday at 2 AM IST (8:30 PM UTC Saturday)
    - cron: '30 20 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis
    # Prepared for a future self-hosted runner without switching to one yet:
    # set the repo/org variable CODEQL_RUNNER_LABEL (Settings -> Secrets and
    # variables -> Actions -> Variables) to a self-hosted runner label to
    # opt in later. Unset, this resolves to "ubuntu-latest" exactly as
    # before — no behavior change until that variable is deliberately set.
    # See docs/SELF_HOSTED_RUNNER_SETUP.md before setting it.
    runs-on: ${{ vars.CODEQL_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # security-extended (not security-and-quality): keeps every security
      # query security-and-quality would run, drops only the pure code-style/
      # quality queries (naming conventions, dead code, etc. — not
      # vulnerabilities). This alone cut the query count from 244 to a much
      # smaller security-focused set, directly addressing the run times that
      # were exceeding this account's available Actions minutes. See
      # docs/CODEQL_STRATEGY.md for the full rationale.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gradle dependency/wrapper caching — the debug APK build previously
      # re-downloaded the full Gradle/Android dependency graph from scratch
      # every run (~12 minutes of the ~25-40 minute total job time).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('flutter-app/android/**/*.gradle*', 'flutter-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Build (required for CodeQL to analyze generated code)
        working-directory: flutter-app
        run: flutter build apk --debug
        env:
          # Use placeholder values for CodeQL scan only
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key

      # This repo is private and does not have GitHub Advanced Security
      # (Code scanning) enabled — that's a paid feature on private repos and
      # is not being turned on without an explicit decision. Without it, the
      # default `upload: always` fails every run at the upload step (SARIF
      # upload is rejected with "Code scanning is not enabled for this
      # repository"), even though the analysis itself completes cleanly.
      # `upload: never` keeps the full CodeQL analysis running without
      # attempting that upload. See docs/CODEQL_ADVANCED_SECURITY.md for
      # what this trades off and how to switch back once Advanced Security
      # is enabled.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
          upload: never
          output: codeql-results

      - name: Upload CodeQL results as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-flutter
          path: codeql-results
          retention-days: 30
