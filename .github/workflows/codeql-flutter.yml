name: CodeQL Security Scan (Flutter/Android)

on:
  push:
    branches: [main, feature/trust-certificates]
    paths:
      - 'flutter-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'flutter-app/**'
  schedule:
    # Run every Sunday at 2 AM IST (8:30 PM UTC Saturday)
    - cron: '30 20 * * 6'

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Build (required for CodeQL to analyze generated code)
        working-directory: flutter-app
        run: flutter build apk --debug
        env:
          # Use placeholder values for CodeQL scan only
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key

      # This repo is private and does not have GitHub Advanced Security
      # (Code scanning) enabled — that's a paid feature on private repos and
      # is not being turned on without an explicit decision. Without it, the
      # default `upload: always` fails every run at the upload step (SARIF
      # upload is rejected with "Code scanning is not enabled for this
      # repository"), even though the analysis itself completes cleanly.
      # `upload: never` keeps the full CodeQL analysis running on every push/
      # PR without attempting that upload. See docs/CODEQL_ADVANCED_SECURITY.md
      # for what this trades off and how to switch back once Advanced
      # Security is enabled.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
          upload: never
          output: codeql-results

      - name: Upload CodeQL results as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-flutter
          path: codeql-results
          retention-days: 30
