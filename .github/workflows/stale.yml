name: Stale Issue & PR Manager

on:
  schedule:
    # Run every day at midnight IST (6:30 PM UTC)
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Issues ──────────────────────────────────────────────────────────
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: stale
          close-issue-label: wontfix
          stale-issue-message: |
            👋 This issue has been inactive for 30 days.
            If this is still relevant, please leave a comment to keep it open.
            It will be automatically closed in 14 days if there's no activity.
          close-issue-message: |
            🔒 Closing due to inactivity. Feel free to reopen if this becomes relevant again.

          # ── Pull Requests ────────────────────────────────────────────────────
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          close-pr-label: stale
          stale-pr-message: |
            👋 This PR has been inactive for 14 days.
            Please update it or leave a comment — it will be closed in 7 days if there's no activity.
          close-pr-message: |
            🔒 Closing this PR due to inactivity. You can always reopen it when ready.

          # ── Exemptions ──────────────────────────────────────────────────────
          exempt-issue-labels: 'pinned,security,bug,in-progress'
          exempt-pr-labels: 'pinned,security,do-not-merge'
          exempt-draft-pr: true

          # Remove stale label when there's new activity
          remove-stale-when-updated: true
          delete-branch: false
