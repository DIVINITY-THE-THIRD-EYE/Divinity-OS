name: Stale Issue & PR Manager

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: |
            👋 This issue has been inactive for 30 days. Leave a comment to keep it open — it closes in 14 days if there's no activity.
          close-issue-message: |
            🔒 Closing due to inactivity. Feel free to reopen when needed!
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: |
            👋 This PR has had no activity for 14 days. Please update it — it closes in 7 days if no activity.
          close-pr-message: |
            🔒 Closing due to inactivity. Reopen when ready!
          exempt-issue-labels: 'pinned,security,in-progress'
          exempt-pr-labels: 'pinned,security,do-not-merge'
          exempt-draft-pr: true
          remove-stale-when-updated: true
