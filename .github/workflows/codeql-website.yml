name: CodeQL Security Scan (Website)

on:
  push:
    branches: [main, feature/trust-certificates]
    paths:
      - 'website/**'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
  schedule:
    - cron: '30 20 * * 6'

jobs:
  analyze:
    name: CodeQL Analysis (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          # GitHub Advanced Security (required to upload results to the
          # Security tab on a private repo) isn't purchased for this org.
          # Analysis still runs in full; upload just fails with a 403/422
          # otherwise. Flip this back to true (or remove) once GHAS is
          # enabled or the repo goes public.
          upload: false
