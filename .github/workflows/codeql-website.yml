name: CodeQL Security Scan (Website)

# Repo went public on 2026-07-05: GitHub-hosted Actions minutes are now
# unlimited for public repos, and GitHub Advanced Security (Code scanning) is
# free — the two constraints that pushed this off pull_request are gone, so
# pull_request is back. See docs/CODEQL_VERIFICATION.md and
# docs/GITHUB_CONFIGURATION_REPORT.md for the re-audit that confirmed this.
on:
  push:
    branches: [main, feature/trust-certificates]
    paths:
      - 'website/**'
  # No paths filter on PRs: "CodeQL Analysis (JavaScript/TypeScript)" is a
  # REQUIRED status check in branch protection. A path filter here means it
  # never reports on flutter-only/supabase-only PRs, which then stay
  # permanently "blocked" (same bug as codeql-flutter.yml had for PR #28;
  # this instance surfaced on the release-please divinity_flutter PR #24,
  # which touches zero website files). Always run, gate the heavy
  # install/scan steps behind a change-detection guard so the required
  # context still posts green on unrelated PRs.
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 20 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis (JavaScript/TypeScript)
    # Prepared for a future self-hosted runner without switching to one yet:
    # set the repo/org variable CODEQL_RUNNER_LABEL (Settings -> Secrets and
    # variables -> Actions -> Variables) to a self-hosted runner label to
    # opt in later. Unset, this resolves to "ubuntu-latest" exactly as
    # before — no behavior change until that variable is deliberately set.
    # See docs/SELF_HOSTED_RUNNER_SETUP.md before setting it.
    runs-on: ${{ vars.CODEQL_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only PRs get the short-circuit; push/schedule/dispatch always scan.
      - name: Detect website changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            website:
              - 'website/**'
              - '.github/workflows/codeql-website.yml'

      # security-extended (not security-and-quality): keeps every security
      # query security-and-quality would run, drops only the pure code-style/
      # quality queries (not vulnerabilities). See docs/CODEQL_STRATEGY.md.
      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || steps.changes.outputs.website == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.website == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.website == 'true'
        working-directory: website
        run: npm ci

      # Advanced Security (Code scanning) is enabled now that the repo is
      # public, so the default upload:always works — results go to the
      # Security tab instead of only a downloadable artifact. See
      # docs/CODEQL_VERIFICATION.md for the run that confirmed this.
      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || steps.changes.outputs.website == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
