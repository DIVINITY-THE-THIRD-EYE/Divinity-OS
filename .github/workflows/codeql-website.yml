name: CodeQL Security Scan (Website)

on:
  push:
    branches: [main, feature/trust-certificates]
    paths:
      - 'website/**'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
  schedule:
    - cron: '30 20 * * 6'

jobs:
  analyze:
    name: CodeQL Analysis (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # This repo is private and does not have GitHub Advanced Security
      # (Code scanning) enabled — that's a paid feature on private repos and
      # is not being turned on without an explicit decision. Without it, the
      # default `upload: always` fails every run at the upload step (SARIF
      # upload is rejected with "Code scanning is not enabled for this
      # repository"), even though the analysis itself completes cleanly.
      # `upload: never` keeps the full CodeQL analysis running on every push/
      # PR without attempting that upload. See docs/CODEQL_ADVANCED_SECURITY.md
      # for what this trades off and how to switch back once Advanced
      # Security is enabled.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          upload: never
          output: codeql-results

      - name: Upload CodeQL results as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-website
          path: codeql-results
          retention-days: 30
