name: Flutter CI

on:
  push:
    branches: [main, feature/trust-certificates]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/flutter.yml'
  # No paths filter on PRs: "Flutter Analyze" and "Flutter Tests" are REQUIRED
  # status checks in branch protection. A path filter here means they never
  # report on website/supabase-only PRs, which then stay permanently "blocked".
  # Instead the jobs always run and short-circuit their heavy steps when no
  # Flutter files changed (see the change-detection guard below), so the
  # required contexts still post green.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter-app

jobs:
  # ─── Flutter Analysis ────────────────────────────────────────────────────────
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Flutter changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            flutter:
              - 'flutter-app/**'
              - '.github/workflows/flutter.yml'

      - name: Set up Flutter
        if: steps.changes.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.changes.outputs.flutter == 'true'
        run: flutter pub get

      - name: Verify formatting
        if: steps.changes.outputs.flutter == 'true'
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Run flutter analyze
        if: steps.changes.outputs.flutter == 'true'
        run: flutter analyze --fatal-infos

      - name: No Flutter changes — skipping
        if: steps.changes.outputs.flutter != 'true'
        run: echo "No flutter-app changes in this PR; analyze skipped (required check passes)."

  # ─── Flutter Unit & Widget Tests ─────────────────────────────────────────────
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Flutter changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            flutter:
              - 'flutter-app/**'
              - '.github/workflows/flutter.yml'

      - name: Set up Flutter
        if: steps.changes.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.changes.outputs.flutter == 'true'
        run: flutter pub get

      - name: Run tests with coverage
        if: steps.changes.outputs.flutter == 'true'
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always() && steps.changes.outputs.flutter == 'true'
        with:
          file: flutter-app/coverage/lcov.info
          flags: flutter
          fail_ci_if_error: false

      - name: No Flutter changes — skipping
        if: steps.changes.outputs.flutter != 'true'
        run: echo "No flutter-app changes in this PR; tests skipped (required check passes)."

  # ─── Android Release Build ────────────────────────────────────────────────────
  build-android:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Restore signing credentials from GitHub Secrets
      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: divinity-release-aab
          path: flutter-app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
