name: Release Please (Website)

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release PR (website)
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: website/release-please-config.json
          manifest-file: website/.release-please-manifest.json
