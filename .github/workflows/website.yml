name: Next.js Website CI

on:
  push:
    branches: [main, feature/trust-certificates]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  # ─── Lint & Type-check ───────────────────────────────────────────────────────
  lint:
    name: ESLint & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─── Production Build ────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

  # ─── Vitest Unit Tests ───────────────────────────────────────────────────────
  test:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ─── Playwright E2E (incl. accessibility + visual regression) ───────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 14

  # ─── Lighthouse CI (performance budgets, D009) ───────────────────────────────
  lighthouse:
    name: Lighthouse CI (desktop + mobile budgets)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      # Desktop budget (D009): performance >=95, LCP <2.0s, CLS <0.05 (hard).
      - name: Lighthouse CI — desktop
        run: npx @lhci/cli@0.14.x autorun --config=./lighthouserc.desktop.json

      # Mobile budget (D009): performance >=90 (hard). Raw LCP is asserted as
      # a warning, not an error — mobile's simulated CPU+network throttling
      # is measurably sensitive to the runner's own host load (see
      # WEBSITE_REBUILD/STATUS.md's 15_PERFORMANCE.md entry for the control
      # test proving this), so only the composite score is a hard gate here.
      - name: Lighthouse CI — mobile
        run: npx @lhci/cli@0.14.x autorun --config=./lighthouserc.mobile.json
