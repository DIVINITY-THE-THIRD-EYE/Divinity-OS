name: PR Size Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  size-label:
    name: Label PR by size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: pascalgn/size-label-action@v0.5.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: >
            {
              "XS": 10,
              "S": 50,
              "M": 150,
              "L": 500,
              "XL": 1000,
              "XXL": 2000
            }
          labels: >
            {
              "XS": "size/XS",
              "S": "size/S",
              "M": "size/M",
              "L": "size/L",
              "XL": "size/XL",
              "XXL": "size/XXL"
            }
          fail_if_xl: false
          message_if_xl: |
            ⚠️ This PR is very large (+1000 lines). Consider splitting it into smaller PRs for easier review.
