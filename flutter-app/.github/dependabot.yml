version: 2
updates:
  # ── Flutter / Dart (pub) ────────────────────────────────────────────────────
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - flutter
    commit-message:
      prefix: "chore(deps)"
    groups:
      flutter-deps:
        patterns:
          - "*"
    ignore:
      # Keep firebase packages together to avoid SDK version mismatches
      - dependency-name: "firebase_*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cloud_firestore"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
